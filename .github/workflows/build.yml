name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_branch: ${{ steps.version.outputs.release_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine build version
        id: version
        shell: bash
        run: |
          RELEASE_BRANCH="false"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
            RELEASE_BRANCH="true"
          else
            VERSION="0.1.0-SNAPSHOT"
          fi

          if [[ "$VERSION" != "0.1.0-SNAPSHOT" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release version: $VERSION"
              exit 1
            fi

            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi

            echo "gradle_args=-PreleaseVersion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            PRERELEASE="false"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew clean build --no-daemon ${{ steps.version.outputs.gradle_args }}

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExtendedItems-${{ steps.version.outputs.version }}
          path: build/libs/extendeditems-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release artifact
        run: ./gradlew clean build --no-daemon -PreleaseVersion=${{ needs.build.outputs.version }}

      - name: Create GitHub prerelease from tag
        if: needs.build.outputs.prerelease == 'true' && needs.build.outputs.release_branch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --verify-tag \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease

      - name: Create GitHub release from tag
        if: needs.build.outputs.prerelease != 'true' && needs.build.outputs.release_branch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --verify-tag \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes

      - name: Create GitHub prerelease from release branch
        if: needs.build.outputs.prerelease == 'true' && needs.build.outputs.release_branch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --target "$GITHUB_SHA" \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease

      - name: Create GitHub release from release branch
        if: needs.build.outputs.prerelease != 'true' && needs.build.outputs.release_branch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --target "$GITHUB_SHA" \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes
