name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event.head_commit.message }}" == "Release ExtendedItems 0.1.0-alpha.7" ]]; then
            VERSION="0.1.0-alpha.7"
          else
            VERSION="0.1.0-SNAPSHOT"
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == "0.1.0-SNAPSHOT" ]]; then
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_args=-PreleaseVersion=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon ${{ steps.version.outputs.gradle_args }}

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExtendedItems-${{ steps.version.outputs.version }}
          path: build/libs/extendeditems-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.head_commit.message == 'Release ExtendedItems 0.1.0-alpha.7'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release artifact
        run: ./gradlew clean build --no-daemon -PreleaseVersion=${{ needs.build.outputs.version }}

      - name: Create GitHub prerelease from release commit
        if: github.event.head_commit.message == 'Release ExtendedItems 0.1.0-alpha.7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-alpha.7" \
            "build/libs/extendeditems-0.1.0-alpha.7.jar" \
            --target "$GITHUB_SHA" \
            --title "ExtendedItems 0.1.0-alpha.7" \
            --generate-notes \
            --prerelease

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --verify-tag \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --verify-tag \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes
