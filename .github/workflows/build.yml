name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: $GITHUB_REF_NAME"
              echo "Expected a tag such as v0.1.0 or v0.1.0-beta.1"
              exit 1
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "gradle_args=-PreleaseVersion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon ${{ steps.version.outputs.gradle_args }}

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExtendedItems-${{ steps.version.outputs.version }}
          path: build/libs/extendeditems-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release artifact
        run: ./gradlew clean build --no-daemon -PreleaseVersion=${{ needs.build.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/extendeditems-${{ needs.build.outputs.version }}.jar" \
            --verify-tag \
            --title "ExtendedItems ${{ needs.build.outputs.version }}" \
            --generate-notes
